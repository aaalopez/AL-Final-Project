<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f4649"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8c82"/>
    </marker>
  </defs>

  <text x="500" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#2f4649">FINtellect agent architecture</text>

  <!-- UI entry clusters -->
  <g font-size="11.5" fill="#2c2c2c">
    <rect x="30" y="46" width="210" height="44" rx="8" fill="#fdf0e4" stroke="#c0552f" stroke-width="1"/>
    <text x="135" y="63" text-anchor="middle" font-weight="700">101s · Misconceptions</text>
    <text x="135" y="78" text-anchor="middle" font-weight="700">Common Questions · Kids</text>

    <rect x="270" y="46" width="160" height="44" rx="8" fill="#fbe7e3" stroke="#7a2b22" stroke-width="1"/>
    <text x="350" y="73" text-anchor="middle" font-weight="700">Common Scams</text>

    <rect x="460" y="46" width="160" height="44" rx="8" fill="#eaf1e8" stroke="#2f6e3a" stroke-width="1"/>
    <text x="540" y="73" text-anchor="middle" font-weight="700">Ask a Loved One</text>

    <rect x="650" y="46" width="160" height="44" rx="8" fill="#e6eef0" stroke="#1f5c66" stroke-width="1"/>
    <text x="730" y="73" text-anchor="middle" font-weight="700">Ask a Question</text>
  </g>

  <!-- arrows UI -> agents -->
  <line x1="135" y1="90" x2="135" y2="128" stroke="#2f4649" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="90" x2="350" y2="128" stroke="#2f4649" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="90" x2="540" y2="128" stroke="#2f4649" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="90" x2="730" y2="128" stroke="#2f4649" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent boxes -->
  <g font-size="13">
    <rect x="30" y="130" width="210" height="62" rx="10" fill="#c0552f" />
    <text x="135" y="156" text-anchor="middle" fill="#fff" font-weight="700">Tutor Agent</text>
    <text x="135" y="174" text-anchor="middle" fill="#fff" font-size="10.5">explain/correct/answer, cached</text>

    <rect x="270" y="130" width="160" height="62" rx="10" fill="#7a2b22" />
    <text x="350" y="156" text-anchor="middle" fill="#fff" font-weight="700">Scam-Checker</text>
    <text x="350" y="174" text-anchor="middle" fill="#fff" font-size="10.5">pasted_content = data</text>

    <rect x="460" y="130" width="160" height="62" rx="10" fill="#2f6e3a" />
    <text x="540" y="156" text-anchor="middle" fill="#fff" font-weight="700">Family-Bridge</text>
    <text x="540" y="174" text-anchor="middle" fill="#fff" font-size="10.5">draft only, never sends</text>

    <rect x="650" y="130" width="160" height="62" rx="10" fill="#1f5c66" />
    <text x="730" y="156" text-anchor="middle" fill="#fff" font-weight="700">Chat Agent</text>
    <text x="730" y="174" text-anchor="middle" fill="#fff" font-size="10.5">multi-turn, factual</text>
  </g>

  <!-- hand-off arrows -->
  <path d="M135,192 C135,230 460,230 460,165" fill="none" stroke="#4c8c82" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
  <path d="M350,192 C350,225 460,225 460,180" fill="none" stroke="#4c8c82" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
  <text x="300" y="222" font-size="10.5" fill="#2f6e3a" font-style="italic">hand-off via last-result-store</text>

  <!-- sources.py box -->
  <rect x="820" y="128" width="150" height="66" rx="8" fill="#fff" stroke="#8a6fae" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="895" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#5b3d8a">agents/sources.py</text>
  <text x="895" y="165" text-anchor="middle" font-size="10" fill="#5b3d8a">citation whitelist</text>
  <text x="895" y="179" text-anchor="middle" font-size="10" fill="#5b3d8a">(7 homepages only)</text>
  <path d="M820,150 C700,110 500,145 240,150" fill="none" stroke="#8a6fae" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M820,165 C790,185 760,185 735,192" fill="none" stroke="#8a6fae" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="895" y="80" text-anchor="middle" font-size="9.5" fill="#8a6fae">(used by FAQ / kids-investing / chat answers)</text>

  <!-- converge arrows into client.py -->
  <line x1="135" y1="192" x2="440" y2="330" stroke="#2f4649" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="192" x2="460" y2="330" stroke="#2f4649" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="192" x2="540" y2="330" stroke="#2f4649" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="192" x2="580" y2="330" stroke="#2f4649" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- client.py box -->
  <rect x="340" y="332" width="320" height="56" rx="10" fill="#2f4649"/>
  <text x="500" y="356" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">agents/client.py — shared chat()</text>
  <text x="500" y="374" text-anchor="middle" fill="#cfe3e0" font-size="10.5">one integration point, one place usage is logged</text>

  <!-- to usage_log.csv -->
  <line x1="660" y1="360" x2="800" y2="360" stroke="#2f4649" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="800" y="332" width="170" height="56" rx="8" fill="#fff" stroke="#2f4649" stroke-width="1.5"/>
  <text x="885" y="355" text-anchor="middle" font-size="11" font-weight="700" fill="#2f4649">logs/usage_log.csv</text>
  <text x="885" y="370" text-anchor="middle" font-size="10" fill="#2f4649">tokens + cost per call</text>

  <!-- to Portkey -->
  <line x1="500" y1="388" x2="500" y2="426" stroke="#2f4649" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="370" y="428" width="260" height="50" rx="10" fill="#fff" stroke="#2f4649" stroke-width="1.5"/>
  <text x="500" y="458" text-anchor="middle" font-size="12" font-weight="700" fill="#2f4649">Portkey Gateway (PORTKEY_API_KEY)</text>

  <!-- to model -->
  <line x1="500" y1="478" x2="500" y2="516" stroke="#2f4649" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="350" y="518" width="300" height="54" rx="10" fill="#8a6fae"/>
  <text x="500" y="542" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">gpt-6-luna</text>
  <text x="500" y="560" text-anchor="middle" fill="#ece6f7" font-size="10.5">course model, temperature fixed at 1</text>

  <text x="500" y="610" text-anchor="middle" font-size="10.5" fill="#5b5b5b" font-style="italic">Solid arrows = direct calls. Dashed green = one agent's output passed as the next agent's input (UI-level hand-off, not agent-to-agent tool-calling). Dashed purple = shared instruction text, not a runtime call.</text>
</svg>
